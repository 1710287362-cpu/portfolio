            <img class="thumb" src="./assets/images/lost-stars-cover.jpg" alt="《迷失的星星》封面" />

    <!-- 下载简历弹窗 -->
    <div class="modal-overlay" id="resumeModal">
      <div class="modal-box">
        <h3>下载简历</h3>
        <p>选择您需要的简历文件格式进行下载。</p>
        <div class="modal-actions">
          <button class="modal-btn cancel" id="closeModal">取消</button>
          <button class="modal-btn download" id="do-download">下载 PDF</button>
        </div>
      </div>
    </div>

    <!-- 项目视频弹窗 -->
    <div class="video-modal" id="videoModal">
      <button class="video-modal-close" id="closeVideoModal">✕</button>
      <video id="modalVideo" controls="" playsinline="" webkit-playsinline="" x5-playsinline=""></video>
    </div>

    <!-- 站内网站预览（沉浸式打开外部链接） -->
    <div class="site-viewer" id="siteViewer">
      <div class="site-viewer-bar">
        <button class="site-viewer-back" id="siteViewerBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

      </div>

    <!-- 项目详情视图：上面视频 + 下面提案排版（内容动态填充） -->

        <button class="site-viewer-back" id="projectViewerBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

        </button>
        <div class="site-viewer-title" id="projectViewerTitle"></div>
        <span class="site-viewer-newtab" style="visibility:hidden">占位</span>
      </div>
      <div class="project-viewer-body">
        <video id="projectViewerVideo" controls playsinline webkit-playsinline x5-playsinline></video>
        <div class="project-viewer-caption">创意提案 · 排版设计</div>
        <div class="project-viewer-imgs" id="projectViewerImgs"></div>
